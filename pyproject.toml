[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wet-steam-turbine-blade-erosion-pinn"
version = "0.1.0"
description = "Wet Steam Droplet Nucleation & Low-Pressure Steam Turbine Blade Erosion in Al-Hartha Power Station with Multiphase PINNs"
authors = [{ name = "Mohammed Basra", email = "researcher@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0"
]
